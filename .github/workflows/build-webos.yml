name: Build for webOS
on: [push, pull_request]
env:
  app_id: inputstream.adaptive

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ZIP_NAME_SUFFIX: [webos]
    steps:
    - name: Download webOS NDK
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "openlgtv/buildroot-nc4"
        latest: true
        fileName: "arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
        out-file-path: "/tmp"

    - name: Extract webOS NDK + install ares
      working-directory: /tmp
      run: |
        tar xzf arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
        ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

        npm install -g @webos-tools/cli

    - name: Checkout Kodi repo
      uses: actions/checkout@v6
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Bootstrap depends
      run: |
        sudo apt-get install -y libcurl4-openssl-dev

        cd xbmc/tools/depends
        ./bootstrap
        ./configure --prefix=${{ github.workspace }}/xbmc-deps \
                    --with-toolchain=/tmp/arm-webos-linux-gnueabi_sdk-buildroot \
                    --host=arm-webos-linux-gnueabi \
                    --with-platform=webos \
                    --enable-debug=no

    - name: Build Kodi depends
      run: |
        cd xbmc/tools/depends
        make -j$(nproc)

    - name: Build Kodi CMake files
      run: |
        cd xbmc/tools/depends/target/cmakebuildsys
        make -j$(nproc)

    - name: Build Kodi
      run: |
        cd xbmc/build
        make -j$(nproc)

    - name: Checkout add-on repo
      uses: actions/checkout@v6
      with:
        path: ${{ env.app_id }}

    - name: Configure
      run: |
        cd ${app_id} && mkdir -p build && cd build
        cmake -DADDONS_TO_BUILD=${app_id} \
              -DADDON_SRC_PREFIX=${{ github.workspace }} \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/xbmc/addons:${{ github.workspace }}/xbmc-deps" \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/xbmc-deps/arm-webos-linux-gnueabi-release/share/Toolchain_binaddons.cmake \
              -DPACKAGE_ZIP=1 \
              -DPACKAGE_DIR=${{ github.workspace }}/build_zips \
              ${{ github.workspace }}/xbmc/cmake/addons

    - name: Build
      run: |
        cd ${app_id}/build
        make

    - name: Run tests
      run: |
        cd ${app_id}/build/${app_id}-prefix/src/${app_id}-build
        make CTEST_OUTPUT_ON_FAILURE=1 GTEST_COLOR=1 test

    - name: Make ZIP artifact
      run: |
        cd ${{ github.workspace }}/xbmc/addons
        zip -r inputstream.adaptive.zip inputstream.adaptive

    - name: Upload zipped artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.app_id }}_${{ matrix.ZIP_NAME_SUFFIX }}.zip
        path: ${{ github.workspace }}/xbmc/addons/inputstream.adaptive.zip
